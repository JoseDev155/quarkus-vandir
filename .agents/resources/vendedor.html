<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta | Vandir System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Menú Lateral - Vendedor -->
<aside class="sidebar">
    <div class="sidebar-header">
        <h2>Vandir System</h2>
        <p class="user-role">Vendedor</p>
    </div>
    <ul class="sidebar-menu">
        <li class="menu-section">Ventas</li>
        
        <li><a href="vendedor.html" class="active">🛒 Nueva Venta</a></li>
        
        <li><a href="consultar-precios.html">📦 Consultar Precios</a></li>
        
        <li><a href="mis-clientes.html">👥 Mis Clientes</a></li>
    </ul>
</aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="topbar">
                <div class="user-profile"><span>Hola, Carlos (Caja 1)</span></div>
                <button class="logout-btn" onclick="window.location.href='login.html'">Salir</button>
            </header>

            <!-- Área de Trabajo: Punto de Venta -->
            <section class="workspace">
                <div class="pos-container">
                    <!-- Lista de Productos -->
                    <div class="pos-products">
                        <div class="input-group">
                            <input type="text" placeholder="Buscar producto por código o nombre...">
                        </div>
                        <br>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>A001</td>
                                    <td>Taladro Inalámbrico 20V</td>
                                    <td>$120.00</td>
                                    <td><button style="padding: 5px; cursor: pointer;">Agregar</button></td>
                                </tr>
                                <tr>
                                    <td>A002</td>
                                    <td>Set de Brocas</td>
                                    <td>$15.50</td>
                                    <td><button style="padding: 5px; cursor: pointer;">Agregar</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Carrito de Compras -->
                    <div class="pos-cart">
                        <h3>Detalle de Venta</h3>
                        <hr style="margin: 10px 0; border: 0; border-top: 1px solid #ccc;">
                        <p>1x Taladro Inalámbrico 20V - $120.00</p>
                        <hr style="margin: 10px 0; border: 0; border-top: 1px solid #ccc;">
                        <h2 style="text-align: right; margin-top: 10px;">Total: $120.00</h2>
                        <button class="btn-sell">Cobrar Venta</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
