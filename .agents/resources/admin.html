<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Vandir System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Menú Lateral - Administrador -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Vandir System</h2>
                <p class="user-role">Administrador</p>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-section">Sistema</li>
                <!-- Enlaces actualizados para navegación -->
                <li><a href="admin.html" class="active">🔐 Usuarios y Permisos</a></li>
                <li><a href="configuracion.html">⚙️ Configuración General</a></li>
                <li><a href="respaldos.html">💾 Respaldos de Base de Datos</a></li>
            </ul>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="topbar">
                <div class="user-profile"><span>Hola, Admin</span></div>
                <button class="logout-btn" onclick="window.location.href='login.html'">Salir</button>
            </header>

            <!-- Área de Trabajo: Tabla de Usuarios -->
            <section class="workspace">
                <div class="workspace-header">
                    <h2>Gestión de Usuarios</h2>
                    <button class="btn btn-primary">+ Nuevo Usuario</button>
                </div>

                <div class="content-panel">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Carlos Gomez</td>
                                <td>carlos@vandir.com</td>
                                <td>Vendedor</td>
                                <td class="text-success font-bold">Activo</td>
                                <td>
                                    <button class="btn btn-small btn-secondary">Editar</button>
                                    <button class="btn btn-small btn-danger">Bloquear</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Laura Martinez</td>
                                <td>laura@vandir.com</td>
                                <td>Gerente</td>
                                <td class="text-success font-bold">Activo</td>
                                <td>
                                    <button class="btn btn-small btn-secondary">Editar</button>
                                    <button class="btn btn-small btn-danger">Bloquear</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
